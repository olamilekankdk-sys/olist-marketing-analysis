<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Olist E-commerce Dashboard — Looker Studio</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #f5f6f8;
      color: #1a1a1a;
    }
    header {
      padding: 20px 24px;
      background: #1a73e8;
      color: #fff;
    }
    header h1 { margin: 0; font-size: 20px; font-weight: 600; }
    header p { margin: 4px 0 0; font-size: 14px; opacity: 0.9; }
    header a { color: #fff; }
    .report-wrap {
      width: 100%;
      max-width: 1280px;
      margin: 24px auto;
      padding: 0 16px;
    }
    .report-frame {
      position: relative;
      width: 100%;
      padding-top: 75%; /* report aspect ratio; tweak if your report is wider/taller */
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.12);
      overflow: hidden;
    }
    .report-frame iframe {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      border: 0;
    }
    .fallback {
      text-align: center;
      padding: 16px;
      font-size: 14px;
      color: #555;
    }
    .fallback a { color: #1a73e8; }
  </style>
</head>
<body>
  <header>
    <h1>Olist E-commerce Dashboard</h1>
    <p>Live Looker Studio report · <a href="https://github.com/olamilekankdk-sys/olist-marketing-analysis" target="_blank" rel="noopener">view the SQL analysis &amp; code on GitHub</a></p>
  </header>

  <div class="report-wrap">
    <div class="report-frame">
      <iframe
        src="https://lookerstudio.google.com/embed/reporting/99a23161-08fe-49eb-8981-d09050026641/page/"
        allowfullscreen
        sandbox="allow-storage-access-by-user-activation allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox">
      </iframe>
    </div>
    <p class="fallback">
      Report not showing? It may not be shared publicly yet —
      <a href="https://lookerstudio.google.com/reporting/99a23161-08fe-49eb-8981-d09050026641" target="_blank" rel="noopener">
        open it directly in Looker Studio</a>.
    </p>
  </div>
</body>
</html>
